<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>NOISE'O'ROGUE</title>

    <link rel="stylesheet" href="./styles.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  </head>

  <body class="schizo">
    <div class="bg"></div>

    <header class="topbar">
      <div class="brandText">
        <div class="brandText__title">NOISE'O'ROGUE</div>
        <div class="brandText__subtitle">by Boresao</div>
      </div>
    </header>

    <main class="layout">
      <section class="hero">
        <div class="hero__card">
          <div class="hero__headline">FULL TRACKS</div>
          <div class="hero__hint">
            Hotkeys: <span class="kbd">Space</span> play/pause ·
            <span class="kbd">←</span>/<span class="kbd">→</span> seek ·
            <span class="kbd">↑</span>/<span class="kbd">↓</span> volume ·
            <span class="kbd">N</span> next · <span class="kbd">P</span> prev ·
            <span class="kbd">S</span> shuffle · <span class="kbd">L</span> loop
          </div>
        </div>
      </section>

      <section class="gridWrap">
        <div class="sectionTitle">
          <div>TRACKLIST</div>
          <div id="status" class="status">loading tracks.json…</div>
        </div>

        <div id="trackGrid" class="grid"></div>
      </section>
    </main>

    <!-- Fixed bottom player -->
    <footer class="player">
      <div class="player__left">
        <div class="coverWrap">
          <img id="cover" class="cover" src="./covers/placeholder.jpg" alt="cover" />
        </div>

        <div class="meta">
          <div class="meta__title">
            <div id="nowTitle" class="marquee">
              <span id="nowTitleText">—</span>
            </div>
          </div>

          <div id="nowArtist" class="meta__artist">—</div>
          <div id="nowTags" class="meta__tags"></div>
        </div>
      </div>

      <div class="player__center">
        <div class="controls">
          <button id="prevBtn" class="btn" type="button" aria-label="Previous">
            <span class="material-icons-round">skip_previous</span>
          </button>

          <button id="playBtn" class="btn btn--primary" type="button" aria-label="Play/Pause">
            <span class="material-icons-round">play_arrow</span>
          </button>

          <button id="nextBtn" class="btn" type="button" aria-label="Next">
            <span class="material-icons-round">skip_next</span>
          </button>

          <button id="shuffleBtn" class="btn btn--ghost" type="button" aria-label="Shuffle">
            <span class="material-icons-round">shuffle</span>
          </button>

          <button id="loopBtn" class="btn btn--ghost" type="button" aria-label="Loop">
            <span class="material-icons-round">repeat</span>
          </button>

          <a id="dlBtn" class="btn btn--ghost" href="#" download aria-label="Download">
            <span class="material-icons-round">download</span>
          </a>
        </div>

        <div class="timeline">
          <div id="timeCur" class="time">0:00</div>
          <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" />
          <div id="timeDur" class="time">0:00</div>
        </div>
      </div>

      <div class="player__right">
        <div class="vol">
          <div class="vol__label">VOL</div>
          <input id="vol" class="vol__range" type="range" min="0" max="100" value="80" step="1" />
        </div>
      </div>

      <audio id="audio" preload="metadata"></audio>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
